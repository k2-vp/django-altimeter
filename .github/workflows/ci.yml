name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: uv sync --all-extras --dev --locked
      - run: uv build
      - run: bun install --frozen-lockfile
        working-directory: tests/browser
      - run: bun run install:browser
        working-directory: tests/browser
      - run: bun run typecheck
        working-directory: tests/browser
      - run: bun run test:unit
        working-directory: tests/browser
      - run: bun run test:e2e resource_timing.spec.ts journey_e2e.spec.ts
        working-directory: tests/browser

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - run: uv sync --all-extras --dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv build
      - run: uv run pytest -q
        env:
          ALTIMETER_TEST_POSTGRES_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} dbname=postgres user=postgres
          ALTIMETER_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/0

  reference-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [asgi, wsgi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - run: uv build
      - name: Verify ${{ matrix.profile }} image
        run: >-
          docker compose -p altimeter-ci-${{ matrix.profile }}-${{ github.run_id }}
          -f reference/compose.yaml --profile ${{ matrix.profile }} run --build --rm
          verify-${{ matrix.profile }} python -m pytest -q tests
      - name: Clean up ${{ matrix.profile }} services
        if: always()
        run: >-
          docker compose -p altimeter-ci-${{ matrix.profile }}-${{ github.run_id }}
          -f reference/compose.yaml --profile ${{ matrix.profile }} down --remove-orphans
