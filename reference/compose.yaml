# Give every run a unique project name with `docker compose -p <name>`.
# The receiver runs inside pytest on an ephemeral loopback port; no published ports.
services:
  postgres:
    profiles: [asgi, wsgi]
    image: postgres:17.6-alpine
    environment:
      # Test-only trust authentication on the unexposed Compose network.
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    profiles: [asgi, wsgi]
    image: redis:7.4.0-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 3s
      retries: 30

  verify-asgi:
    profiles: [asgi]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      ALTIMETER_TEST_POSTGRES_DSN: "host=postgres port=5432 dbname=postgres user=postgres"
      ALTIMETER_TEST_REDIS_URL: "redis://redis:6379/0"
      ALTIMETER_TEST_CELERY_BROKER: "redis://redis:6379/13"
      ALTIMETER_TEST_CELERY_BACKEND: "redis://redis:6379/14"
    build: &asgi-build
      context: ..
      dockerfile: reference/Dockerfile
      args:
        PYTHON_VERSION: "3.13"
        ASGI_DEPENDENCIES: "1"
        DJANGO_VERSION: "6.0.9"
        # Locked transport versions of the supported ASGI deployment shape.
        REQUESTS_VERSION: "2.33.1"
        URLLIB3_VERSION: "2.6.3"

  verify-wsgi:
    profiles: [wsgi]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      ALTIMETER_TEST_POSTGRES_DSN: "host=postgres port=5432 dbname=postgres user=postgres"
      ALTIMETER_TEST_REDIS_URL: "redis://redis:6379/0"
      ALTIMETER_TEST_CELERY_BROKER: "redis://redis:6379/13"
      ALTIMETER_TEST_CELERY_BACKEND: "redis://redis:6379/14"
    build:
      context: ..
      dockerfile: reference/Dockerfile
      args:
        PYTHON_VERSION: "3.12"
        WSGI_DEPENDENCIES: "1"
        DJANGO_VERSION: "5.2.18"
        # Locked transport versions of the supported WSGI deployment shape.
        REQUESTS_VERSION: "2.32.3"
        URLLIB3_VERSION: "1.26.20"

  # Optional manual worker/beat commands use the same installed-wheel ASGI image.
  # Integration tests launch their own processes with per-test UUID namespaces.
  celery-worker:
    profiles: [asgi]
    build: *asgi-build
    depends_on:
      redis: {condition: service_healthy}
    environment: &celery-environment
      PYTHONPATH: /verify/reference
      DJANGO_SETTINGS_MODULE: altimeter_reference.celery_settings
      ALTIMETER_TEST_CELERY_BROKER: "redis://redis:6379/13"
      ALTIMETER_TEST_CELERY_BACKEND: "redis://redis:6379/14"
      REFERENCE_CELERY_QUEUE: reference
      REFERENCE_CELERY_PREFIX: "reference:"
    command: [python, -m, celery, -A, altimeter_reference.celery_app, worker, --pool=prefork, --concurrency=1, --loglevel=INFO]

  celery-beat:
    profiles: [asgi]
    build: *asgi-build
    depends_on:
      redis: {condition: service_healthy}
    environment:
      <<: *celery-environment
      REFERENCE_CELERY_BEAT: "1"
    command: [python, -m, celery, -A, altimeter_reference.celery_app, beat, --schedule=/tmp/reference-beat, --loglevel=INFO]
